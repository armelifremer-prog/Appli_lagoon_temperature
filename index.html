
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagoon Temperature Survey</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#164e4a">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <img src="logo_Ifremer_blue.jpg" alt="Logo" class="logo">

        <h1>Lagoon Temperature Survey</h1>
        <p class="subtitle">Coastal water temperature observations</p>

        <section class="form-section">

            <label for="contributor">Your name</label>   
            <input
                type="text"
                id="contributor"
                placeholder="Enter your name"
            >
            <label for="datetime">Date and time (UTC)</label>
            <input type="datetime-local" id="datetime">
            <label for="temperature">Water temperature (°C)</label>
            <input
                type="number"
                id="temperature"
                placeholder="e.g. 26.45"
                step="0.01"
            >
            <small>Sensor uncertainty : ±0.07 °C</small>

            <label>GPS position</label>


            <p id="gps-status">Retrieving position...</p>

            <div class="coordinates">
                <p>Latitude: <span id="latitude">—</span></p>
                <p>Longitude: <span id="longitude">—</span></p>
                <p>GPS accuracy: <span id="accuracy">—</span></p>
            </div>

            <button id="submit-button" type="button">
                Submit observation
            </button>

        </section>

    </main>

    <script src="script.js"></script>



    <div id="success-popup" class="popup-overlay">

        <div class="popup-content">
            <div class="success-icon">✓</div>
            <h2>Observation submitted!</h2>
            <p>Thank you for contributing to lagoon monitoring!</p>
            <button id="close-popup" type="button">Great!</button>
        </div>

        <div id="confetti-container"></div>

    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => console.log("Service Worker registered"))
                    .catch(error => console.error("Service Worker error:", error));
            });
        }
    </script>
    
</body>

</html>
